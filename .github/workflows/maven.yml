name: QPlugin build and release

on:
  push:
    branches: [main, hot-update]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qplugin-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, test and create immutable release
        run: ./gradlew --no-daemon build packageHotRelease "-PreleaseId=$GITHUB_SHA"
      - name: Test local deployment client
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - uses: actions/upload-artifact@v4
        with:
          name: qplugin-${{ github.sha }}
          path: build/releases/${{ github.sha }}.zip
          if-no-files-found: error
      - name: Publish test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qplugin-tests-${{ github.sha }}
          path: '**/build/reports/tests/'
          if-no-files-found: ignore
